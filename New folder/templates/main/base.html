{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Med Ingredients Australia | Premium Botanical Extracts</title>
    <meta name="description"
        content="Bio Med Ingredients Australia — supplying premium botanical extracts, nutraceutical ingredients, herbal extracts, cosmetic ingredients and pharmaceutical raw materials globally.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">



    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="shortcut icon" href="{% static 'images/bmi_logo.webp' %}">
    <!-- Google Fonts: Manrope -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=1.6">
</head>

<body>

    <!-- Include Header -->
    {% include 'main/header.html' %}

    <main class="page-main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Scroll to Top Button -->
    <a href="#" class="scroll-to-top" id="scrollToTopBtn" aria-label="Scroll to top">
        <i class="ph ph-arrow-up"></i>
    </a>

    <!-- Include Footer -->
    {% include 'main/footer.html' %}

    {% block modals %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Vanilla Tilt JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>



    <!-- GSAP + ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        // Register GSAP plugin
        gsap.registerPlugin(ScrollTrigger);

        // -- Custom GSAP Reveal (Replaces AOS) --
        document.querySelectorAll('[data-aos]').forEach(el => {
            let animation = el.getAttribute('data-aos');
            let duration = parseInt(el.getAttribute('data-aos-duration')) || 1000;
            let delay = parseInt(el.getAttribute('data-aos-delay')) || 0;

            let fromVars = { opacity: 0 };
            if (animation === 'fade-up') fromVars.y = 40;
            else if (animation === 'fade-down') fromVars.y = -40;
            else if (animation === 'fade-left') fromVars.x = 40;
            else if (animation === 'fade-right') fromVars.x = -40;
            else if (animation === 'zoom-in') { fromVars.scale = 0.9; }

            gsap.fromTo(el, fromVars, {
                opacity: 1, x: 0, y: 0, scale: 1,
                duration: duration / 1000,
                delay: delay / 1000,
                ease: 'power3.out',
                scrollTrigger: {
                    trigger: el,
                    start: 'top 85%',
                    toggleActions: 'play none none reverse'
                }
            });
        });



        // ── Navbar Scroll Effect ─────────────────────────────
        window.addEventListener('scroll', function () {
            const mainNav = document.getElementById('mainNav');
            const blurBg = document.getElementById('navbarBlurBg');
            if (window.scrollY > 50) {
                if (mainNav) mainNav.classList.add('scrolled');
                if (blurBg) blurBg.classList.add('active');
            } else {
                if (mainNav) mainNav.classList.remove('scrolled');
                if (blurBg) blurBg.classList.remove('active');
            }
        });

        // ── Animated Number Counters ─────────────────────────
        function animateCounter(el) {
            const target = parseInt(el.getAttribute('data-target'));
            const suffix = el.getAttribute('data-suffix') || '';
            const duration = 2000;
            const step = target / (duration / 16);
            let current = 0;
            const timer = setInterval(() => {
                current += step;
                if (current >= target) { current = target; clearInterval(timer); }
                el.textContent = Math.floor(current) + suffix;
            }, 16);
        }
        const counterObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !entry.target.classList.contains('counted')) {
                    entry.target.classList.add('counted');
                    animateCounter(entry.target);
                }
            });
        }, { threshold: 0.5 });
        document.querySelectorAll('[data-target]').forEach(el => counterObserver.observe(el));

        // ── Hero Word Reveal ─────────────────────────────────
        const heroTitle = document.querySelector('.hero-title');
        if (heroTitle) {
            gsap.from('.hero-title', { y: 60, opacity: 0, duration: 1.4, ease: 'power4.out', delay: 0.2 });
            gsap.from('.hero-subtitle', { y: 30, opacity: 0, duration: 1.2, ease: 'power3.out', delay: 0.6 });
            gsap.from('.hero-ctas', { y: 20, opacity: 0, duration: 1, ease: 'power3.out', delay: 0.9 });
        }

        // ── Timeline Step Activation ─────────────────────────
        document.querySelectorAll('.timeline-step').forEach((step) => {
            ScrollTrigger.create({
                trigger: step,
                start: 'top 65%',
                onEnter: () => step.classList.add('active'),
                onLeaveBack: () => step.classList.remove('active'),
            });
        });

        // ── Parallax Hero ────────────────────────────────────
        gsap.to('.hero-bg-image', {
            yPercent: 12,
            ease: 'none',
            scrollTrigger: { trigger: '.hero-wrapper', scrub: true }
        });

        // ── Floating Pollen Canvas (Interactive) ──────────────
        const canvas = document.getElementById('particleCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let mouseX = -1000;
            let mouseY = -1000;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Track mouse/touch
            window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
            window.addEventListener('touchmove', (e) => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive: true });
            window.addEventListener('mouseout', () => { mouseX = -1000; mouseY = -1000; });
            window.addEventListener('touchend', () => { mouseX = -1000; mouseY = -1000; });

            const particles = Array.from({ length: 40 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2.5 + 0.5,
                baseDx: (Math.random() - 0.5) * 0.4,
                baseDy: -Math.random() * 0.5 - 0.2,
                opacity: Math.random() * 0.5 + 0.1,
                vx: 0,
                vy: 0
            }));

            (function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(82, 183, 136, ${p.opacity})`;
                    ctx.fill();

                    // Mouse Interaction
                    let dx = mouseX - p.x;
                    let dy = mouseY - p.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let minDist = 120;

                    if (dist < minDist) {
                        let force = (minDist - dist) / minDist;
                        p.vx -= (dx / dist) * force * 0.5;
                        p.vy -= (dy / dist) * force * 0.5;
                    }

                    // Friction & Base Velocity
                    p.vx *= 0.92;
                    p.vy *= 0.92;

                    p.x += p.baseDx + p.vx;
                    p.y += p.baseDy + p.vy;

                    // Wrap around
                    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; p.vx = 0; p.vy = 0; }
                    if (p.x < -10) { p.x = canvas.width + 10; p.y = Math.random() * canvas.height; p.vx = 0; p.vy = 0; }
                    if (p.x > canvas.width + 10) { p.x = -10; p.y = Math.random() * canvas.height; p.vx = 0; p.vy = 0; }
                });
                requestAnimationFrame(drawParticles);
            })();
        }

        // ── Ripple on Button Click ───────────────────────────
        document.querySelectorAll('.btn-premium, .btn-cta-primary, .nav-contact-btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                const ripple = document.createElement('span');
                ripple.className = 'btn-ripple';
                const rect = this.getBoundingClientRect();
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top = (e.clientY - rect.top) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            });
        });

        // ── Magnetic Buttons (Desktop only) ──────────────────
        if (window.matchMedia("(pointer: fine)").matches) {
            document.querySelectorAll('.btn-premium, .btn-cta-primary, .nav-contact-btn').forEach(btn => {
                btn.addEventListener('mousemove', function (e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    gsap.to(this, { x: x * 0.3, y: y * 0.3, duration: 0.3, ease: 'power2.out' });
                });
                btn.addEventListener('mouseleave', function () {
                    gsap.to(this, { x: 0, y: 0, duration: 0.5, ease: 'elastic.out(1, 0.3)' });
                });
            });
        }

        // ── Bootstrap Tooltips ───────────────────────────────
        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));

        // ── Scroll to Top Button ──────────────────────────────
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        if (scrollToTopBtn) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollToTopBtn.classList.add('show');
                } else {
                    scrollToTopBtn.classList.remove('show');
                }
            });

            scrollToTopBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
        // -- Swiper Init --
        const extractSwiper = new Swiper('.extract-swiper', {
            slidesPerView: 'auto',
            spaceBetween: 24,
            loop: true,
            grabCursor: true,
            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            pauseOnMouseEnter: true,
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            breakpoints: {
                320: { spaceBetween: 16 },
                768: { spaceBetween: 24 }
            }
        });

        // -- Vanilla Tilt Init --
        VanillaTilt.init(document.querySelectorAll(".feature-cd"), {
            max: 5,
            speed: 400,
            glare: true,
            "max-glare": 0.1,
            gyroscope: true
        });
    </script>
</body>

</html>
