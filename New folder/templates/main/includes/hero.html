{% load static %}
<!-- ═══════════════════════════════════════════════════════════
     REUSABLE HERO SECTION
═══════════════════════════════════════════════════════════════ -->
<section class="hero-wrapper" style="height: 40vh; min-height: 400px; display: flex; align-items: center;">
    <!-- Parallax Background -->
    <img src="{{ bg_image }}" class="hero-bg-image" alt="{{ title }}"
        onerror="this.src='{% static 'images/hero_bg.webp' %}'">
    <div class="hero-overlay"></div>
    <div class="hero-content w-100 d-flex align-items-center" style="padding-top: 60px;">
        <div class="container position-relative z-1 text-center text-md-start">
            {% if badge %}
            <div class="hero-badge justify-content-center justify-content-md-start mb-3 mx-auto mx-md-0"
                style="padding: 0.4rem 1rem; display: inline-flex; width: fit-content;">
                <span class="hero-badge-dot"></span>
                <span class="text-white fw-bold text-uppercase letter-spacing-2" style="font-size: 0.75rem;">{{ badge }}</span>
            </div>
            {% endif %}
            <h1 class="hero-title mb-3" style="font-size: clamp(2rem, 4vw, 3.5rem);">
                {{ title|safe }}</h1>
            {% if subtitle %}
            <p class="hero-subtitle mb-4 mx-auto mx-md-0"
                style="max-width: 700px; font-size: clamp(1rem, 1.5vw, 1.15rem);">
                {{ subtitle }}
            </p>
            {% endif %}
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-center justify-content-md-start mb-0">
                    <li class="breadcrumb-item"><a href="/" class="text-white-50 text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active text-white" aria-current="page">{{ breadcrumb }}</li>
                </ol>
            </nav>
        </div>
    </div>
</section>
