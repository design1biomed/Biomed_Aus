{% extends "main/dashboard/dashboard_base.html" %}

{% block title %}Delete Category{% endblock %}

{% block dashboard_content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 mb-5">
        <div class="card shadow-sm border-0 rounded-4 mt-5 border-top border-danger border-5">
            <div class="card-body p-5 text-center">
                <div class="mb-4 text-danger">
                    <i class="ph-fill ph-warning-circle" style="font-size: 4rem;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-3">Delete Category?</h3>
                <p class="text-muted mb-4 fs-5">
                    Are you sure you want to permanently delete <strong>"{{ category.name }}"</strong>? This action cannot be undone.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'dashboard_manage_product_document_categories' %}" class="btn btn-light rounded-pill px-4 fw-semibold shadow-sm">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger rounded-pill px-5 fw-bold shadow-sm d-flex align-items-center gap-2">
                            <i class="ph ph-trash"></i> Delete Category
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
