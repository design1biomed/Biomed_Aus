<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Login - Bio Med Ingredients</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --forest: #0b5d3f;
            --forest-dark: #07402a;
            --gold: #d4af37;
            --white: #ffffff;
        }
        body {
            background-color: var(--forest);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }
        /* Abstract Background Elements */
        .bg-element {
            position: absolute;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }
        .bg-element-1 { top: -100px; left: -100px; width: 400px; height: 400px; border-radius: 50%; border: 2px solid var(--gold); }
        .bg-element-2 { bottom: -150px; right: -50px; width: 500px; height: 500px; border-radius: 50%; border: 1px solid var(--white); }
        
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            z-index: 1;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }
        .premium-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--gold);
            color: var(--white);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            outline: none;
        }
        .premium-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .btn-premium {
            background: var(--white);
            color: var(--forest-dark);
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1rem;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="bg-element bg-element-1"></div>
    <div class="bg-element bg-element-2"></div>

    <div class="login-card">
        <div class="text-center mb-4">
            <div style="width: 60px; height: 60px; background: rgba(212, 175, 55, 0.2); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                <i class="ph ph-lock-key fs-2" style="color: var(--gold);"></i>
            </div>
            <h3 class="text-white fw-bold mb-1">Admin Dashboard</h3>
            <p style="color: rgba(255,255,255,0.6);">Sign in to manage your website</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger rounded-3 border-0" style="background: rgba(220, 53, 69, 0.15); color: #ff8793;">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'dashboard_login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-uppercase fw-bold" style="color: rgba(255,255,255,0.7); font-size: 0.8rem; letter-spacing: 1px;">Username</label>
                <input type="text" name="username" class="form-control premium-input" placeholder="Enter username" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-uppercase fw-bold" style="color: rgba(255,255,255,0.7); font-size: 0.8rem; letter-spacing: 1px;">Password</label>
                <input type="password" name="password" class="form-control premium-input" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-premium w-100">Sign In</button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{% url 'index' %}" style="color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem;">
                <i class="ph ph-arrow-left"></i> Back to Website
            </a>
        </div>
    </div>
</body>
</html>
