{% extends "main/base.html" %}
{% load static %}

{% block content %}
<section class="error-404-section py-5 d-flex flex-column justify-content-center align-items-center" style="min-height: 75vh; background: linear-gradient(180deg, #f8faf9 0%, #ffffff 100%);">
    <div class="container text-center py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8" data-aos="fade-up">

                <!-- 404 Visual Indicator -->
                <div class="position-relative mb-4 d-inline-flex justify-content-center align-items-center">
                    <h1 class="display-1 fw-bold text-success opacity-25 m-0 p-0" style="font-size: clamp(6rem, 15vw, 10rem); letter-spacing: -3px; line-height: 1; user-select: none;">
                        404
                    </h1>
                    <div class="position-absolute d-flex flex-column align-items-center justify-content-center">
                        <i class="ph ph-leaf text-success" style="font-size: clamp(2.5rem, 6vw, 4rem);"></i>
                    </div>
                </div>

                <!-- Descriptive Content -->
                <h2 class="display-6 fw-bold text-dark mb-3">Page Not Found</h2>
                <p class="text-muted fs-6 mb-4 mx-auto" style="max-width: 540px; line-height: 1.7;">
                    The botanical dossier, technical document, or page you were seeking has moved, been archived, or is temporarily unavailable.
                </p>

                <!-- Navigation Actions -->
                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a href="{% url 'index' %}" class="btn btn-success rounded-pill px-4 py-3 fw-semibold shadow-sm d-inline-flex align-items-center gap-2">
                        <i class="ph ph-house"></i>
                        <span>Return to Home</span>
                    </a>
                    <a href="{% url 'herbal_extracts' %}" class="btn btn-outline-success rounded-pill px-4 py-3 fw-semibold d-inline-flex align-items-center gap-2">
                        <i class="ph ph-package"></i>
                        <span>Explore Ingredients</span>
                    </a>
                    <a href="{% url 'contact' %}" class="btn btn-light rounded-pill px-4 py-3 fw-semibold border d-inline-flex align-items-center gap-2">
                        <i class="ph ph-chat-teardrop-dots"></i>
                        <span>Contact Support</span>
                    </a>
                </div>

            </div>
        </div>
    </div>
</section>
{% endblock %}
