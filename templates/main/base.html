{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Med Ingredients Australia | Premium Botanical Extracts</title>
    <meta name="description"
        content="Bio Med Ingredients Australia — supplying premium botanical extracts, nutraceutical ingredients, herbal extracts, cosmetic ingredients and pharmaceutical raw materials globally.">

    <!-- DNS Preconnect: Resolve CDN hostnames before the browser even asks for them -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'images/bmi_logo.webp' %}">

    <!-- Bootstrap CSS (render-blocking, must be first) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=4.1">

    <!-- Google Fonts: Non-blocking load (does not delay first paint) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

    <!-- Phosphor Icons: Deferred so it never blocks first paint -->
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

    <!-- Google Translate Banner & Top Shift Suppression -->
    <style>
        html, body {
            top: 0px !important;
            position: static !important;
        }
        iframe.VIpgJd-ZVi9od-ORHb-OEVmcd,
        .VIpgJd-ZVi9od-ORHb-OEVmcd,
        .VIpgJd-ZVi9od-xl07Ob-OEVmcd,
        .VIpgJd-ZVi9od-SmfZ-OEVmcd,
        .VIpgJd-yAWNEb-L7lbkb,
        iframe[class*="VIpgJd"],
        iframe[class*="goog-te-banner"],
        .goog-te-banner-frame,
        iframe.skiptranslate,
        #goog-gt-tt,
        .goog-te-balloon-frame {
            display: none !important;
            visibility: hidden !important;
            height: 0px !important;
            width: 0px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -999999 !important;
            position: absolute !important;
            top: -99999px !important;
        }
        #google_translate_element {
            display: none !important;
        }
        .goog-text-highlight {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body class="preloader-active">
    
    <!-- Preloader -->
    <style>
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Use transparent bg so the pseudo-elements can form the split background */
            background: transparent;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Container fades out entirely after the doors open */
            transition: visibility 1.2s;
        }
        
        /* The left and right doors */
        #preloader::before,
        #preloader::after {
            content: '';
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #f4f9f6 100%);
            z-index: -1;
            transition: transform 1.2s cubic-bezier(0.86, 0, 0.07, 1);
        }
        #preloader::before { left: 0; }
        #preloader::after { right: 0; }

        /* The Opening Split */
        #preloader.split-screen::before {
            transform: translateX(-100%);
        }
        #preloader.split-screen::after {
            transform: translateX(100%);
        }
        
        /* The logo fades out quickly as doors open */
        #preloader .preloader-content {
            transition: opacity 0.5s ease;
        }
        #preloader.split-screen .preloader-content {
            opacity: 0;
        }
        .preloader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .preloader-logo {
            width: 160px;
            height: auto;
            opacity: 0;
            animation: logo-spring 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes logo-spring {
            0% { transform: scale(0.4) translateY(40px); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        body.preloader-active {
            overflow: hidden !important;
        }
    </style>
    <div id="preloader">
        <div class="preloader-content">
            <img src="{% static 'images/bmi_logo.webp' %}" alt="Bio Med Ingredients Australia" class="preloader-logo">
        </div>
    </div>
    <script>
        // Synchronously check if we should show the preloader
        // We only want to show it on the homepage ('/' or '')
        (function() {
            const path = window.location.pathname;
            const isHomePage = (path === '/' || path === '' || path === '/index');
            const alreadyShown = sessionStorage.getItem('preloader_shown');
            
            if (!isHomePage || alreadyShown) {
                const pl = document.getElementById('preloader');
                if (pl) pl.remove();
                document.body.classList.remove('preloader-active');
            } else {
                sessionStorage.setItem('preloader_shown', 'true');
            }
            
            
        })();
    </script>

    <!-- Include Header -->
    {% include 'main/header.html' %}

    <main class="page-main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Scroll to Top Button -->
    <a href="#" class="scroll-to-top" id="scrollToTopBtn" aria-label="Scroll to top">
        <i class="ph ph-arrow-up"></i>
    </a>

    <!-- Include Footer -->
    {% include 'main/footer.html' %}

    {% block modals %}{% endblock %}

    <!-- Bootstrap JS (defer: doesn't block rendering) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Swiper JS (defer) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>

    <!-- Vanilla Tilt JS (defer) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js" defer></script>

    <!-- GSAP + ScrollTrigger — must be synchronous (inline scripts use them immediately) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        // Register GSAP plugin
        gsap.registerPlugin(ScrollTrigger);

        // -- Custom GSAP Reveal (Replaces AOS) --
        document.querySelectorAll('[data-aos]').forEach(el => {
            let animation = el.getAttribute('data-aos');
            let duration = parseInt(el.getAttribute('data-aos-duration')) || 1000;
            let delay = parseInt(el.getAttribute('data-aos-delay')) || 0;

            let fromVars = { opacity: 0 };
            if (animation === 'fade-up') fromVars.y = 40;
            else if (animation === 'fade-down') fromVars.y = -40;
            else if (animation === 'fade-left') fromVars.x = 40;
            else if (animation === 'fade-right') fromVars.x = -40;
            else if (animation === 'zoom-in') { fromVars.scale = 0.9; }

            gsap.fromTo(el, fromVars, {
                opacity: 1, x: 0, y: 0, scale: 1,
                duration: duration / 1000,
                delay: delay / 1000,
                ease: 'power3.out',
                scrollTrigger: {
                    trigger: el,
                    start: 'top 85%',
                    toggleActions: 'play none none reverse'
                }
            });
        });



        // ── Navbar Scroll Effect ─────────────────────────────
        window.addEventListener('scroll', function () {
            const mainNav = document.getElementById('mainNav');
            const blurBg = document.getElementById('navbarBlurBg');
            if (window.scrollY > 50) {
                if (mainNav) mainNav.classList.add('scrolled');
                if (blurBg) blurBg.classList.add('active');
            } else {
                if (mainNav) mainNav.classList.remove('scrolled');
                if (blurBg) blurBg.classList.remove('active');
            }
        });

        // ── Animated Number Counters ─────────────────────────
        function animateCounter(el) {
            const target = parseInt(el.getAttribute('data-target'));
            const suffix = el.getAttribute('data-suffix') || '';
            const duration = 2000;
            const step = target / (duration / 16);
            let current = 0;
            const timer = setInterval(() => {
                current += step;
                if (current >= target) { current = target; clearInterval(timer); }
                el.textContent = Math.floor(current) + suffix;
            }, 16);
        }
        const counterObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !entry.target.classList.contains('counted')) {
                    entry.target.classList.add('counted');
                    animateCounter(entry.target);
                }
            });
        }, { threshold: 0.5 });
        document.querySelectorAll('[data-target]').forEach(el => counterObserver.observe(el));

        // ── Hero Word Reveal ─────────────────────────────────
        const heroTitle = document.querySelector('.hero-title');
        if (heroTitle) {
            gsap.from('.hero-title', { y: 60, opacity: 0, duration: 1.4, ease: 'power4.out', delay: 0.2 });
            gsap.from('.hero-subtitle', { y: 30, opacity: 0, duration: 1.2, ease: 'power3.out', delay: 0.6 });
            gsap.from('.hero-ctas', { y: 20, opacity: 0, duration: 1, ease: 'power3.out', delay: 0.9 });
        }

        // ── Timeline Step Activation ─────────────────────────
        document.querySelectorAll('.timeline-step').forEach((step) => {
            ScrollTrigger.create({
                trigger: step,
                start: 'top 65%',
                onEnter: () => step.classList.add('active'),
                onLeaveBack: () => step.classList.remove('active'),
            });
        });

        // ── Dramatic Cinematic Hero Scroll & Parallax Curtain ────────────────────────────────────
        
        // Push the hero down slightly as you scroll.
        // Because the page scrolls up faster than we push it down, the hero drifts upward slowly while the next section slides over it.
        gsap.to('.hero-wrapper', {
            yPercent: 35, 
            ease: 'none',
            scrollTrigger: {
                trigger: document.body,
                start: 'top top',
                end: () => `+=${window.innerHeight}`,
                scrub: true
            }
        });

        if (document.querySelector('.hero-bg-image')) {
            gsap.to('.hero-bg-image', {
                yPercent: 30,
                scale: 1.15,
                ease: 'none',
                scrollTrigger: { 
                    trigger: document.body, 
                    start: 'top top',
                    end: () => `+=${window.innerHeight}`,
                    scrub: true 
                }
            });
        }

        if (document.querySelector('.hero-content')) {
            gsap.to('.hero-content', {
                yPercent: -60,
                opacity: 0,
                ease: 'none',
                scrollTrigger: { 
                    trigger: document.body, 
                    start: 'top top',
                    end: () => `+=${window.innerHeight * 0.75}`,
                    scrub: true 
                }
            });
        }

        if (document.querySelector('.hero-overlay')) {
            gsap.to('.hero-overlay', {
                opacity: 0.85,
                ease: 'none',
                scrollTrigger: { 
                    trigger: document.body, 
                    start: 'top top',
                    end: () => `+=${window.innerHeight}`,
                    scrub: true
                }
            });
        }

        

        // ── Ripple on Button Click ───────────────────────────
        document.querySelectorAll('.btn-premium, .btn-cta-primary, .nav-contact-btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                const ripple = document.createElement('span');
                ripple.className = 'btn-ripple';
                const rect = this.getBoundingClientRect();
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top = (e.clientY - rect.top) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            });
        });

        // ── Magnetic Buttons (Desktop only) ──────────────────
        if (window.matchMedia("(pointer: fine)").matches) {
            document.querySelectorAll('.btn-premium, .btn-cta-primary, .nav-contact-btn').forEach(btn => {
                btn.addEventListener('mousemove', function (e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    gsap.to(this, { x: x * 0.3, y: y * 0.3, duration: 0.3, ease: 'power2.out' });
                });
                btn.addEventListener('mouseleave', function () {
                    gsap.to(this, { x: 0, y: 0, duration: 0.5, ease: 'elastic.out(1, 0.3)' });
                });
            });
        }

        // ── Bootstrap Tooltips ───────────────────────────────
        function initTooltips() {
            if (typeof bootstrap !== 'undefined') {
                document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTooltips);
        } else {
            initTooltips();
        }
        window.addEventListener('load', initTooltips);

        // ── Scroll to Top Button ──────────────────────────────
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        if (scrollToTopBtn) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollToTopBtn.classList.add('show');
                } else {
                    scrollToTopBtn.classList.remove('show');
                }
            });

            scrollToTopBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
        // -- Swiper Init (must wait for deferred Swiper JS to load) --
        window.addEventListener('load', function() {
            if (typeof Swiper === 'undefined') return;
            const extractSwiper = new Swiper('.extract-swiper', {
                slidesPerView: 'auto',
                spaceBetween: 24,
                loop: true,
                grabCursor: true,
                speed: 800,
                autoplay: {
                    delay: 2500,
                    disableOnInteraction: false,
                },
                pagination: {
                    el: '.extract-swiper .swiper-pagination',
                    clickable: true,
                },
                breakpoints: {
                    0: {
                        centeredSlides: true,
                        spaceBetween: 16,
                    },
                    992: {
                        centeredSlides: false,
                        spaceBetween: 24,
                    }
                }
            });

            // Pause Swiper when hovering cards
            document.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('mouseenter', () => extractSwiper.autoplay.stop());
                card.addEventListener('mouseleave', () => extractSwiper.autoplay.start());
            });
        });

        // -- Vanilla Tilt Init --
        VanillaTilt.init(document.querySelectorAll(".feature-cd"), {
            max: 5,
            speed: 400,
            glare: true,
            "max-glare": 0.1,
            gyroscope: true
        });
    </script>
    <!-- Lenis Smooth Scroll -->
    <style>
        html.lenis, html.lenis body { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }
        .lenis.lenis-smooth iframe { pointer-events: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize Lenis Smooth Scroll
            if (typeof Lenis !== 'undefined') {
                window.lenis = new Lenis({
                    lerp: 0.06,
                    smoothWheel: true,
                    wheelMultiplier: 0.9,
                    smoothTouch: true,
                    touchMultiplier: 1.5,
                    infinite: false
                });

                // Sync Lenis with GSAP ScrollTrigger to prevent rendering glitches/jitter
                if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
                    window.lenis.on('scroll', ScrollTrigger.update);
                    gsap.ticker.add((time) => {
                        window.lenis.raf(time * 1000);
                    });
                    gsap.ticker.lagSmoothing(0);
                } else {
                    // Fallback if GSAP is not loaded
                    function raf(time) {
                        window.lenis.raf(time);
                        requestAnimationFrame(raf);
                    }
                    requestAnimationFrame(raf);
                }

                // If the preloader is still showing, immediately stop Lenis
                // CSS overflow:hidden does NOT block Lenis since it uses JS transforms
                if (document.getElementById('preloader')) {
                    window.lenis.stop();
                }
            }
        });
    </script>

    <!-- GDPR / ePrivacy Cookie Consent Banner -->
    {% include 'main/includes/cookie_banner.html' %}


    <!-- Preloader JS -->
    <script>
        // Immediately lock native scroll (CSS already sets overflow:hidden on .preloader-active)
        // Also lock Lenis if it's already running
        function lockScroll() {
            document.body.classList.add('preloader-active');
            if (window.lenis) window.lenis.stop();
        }

        function unlockScroll() {
            document.body.classList.remove('preloader-active');
            if (window.lenis) window.lenis.start();
        }

        function dismissPreloader() {
            const preloader = document.getElementById('preloader');
            if (!preloader || preloader.dataset.dismissed) return;
            preloader.dataset.dismissed = 'true'; // prevent double-firing
            setTimeout(() => {
                preloader.classList.add('split-screen'); // Start the door opening animation
                setTimeout(() => {
                    preloader.remove();   // Remove preloader from DOM
                    unlockScroll();       // Only NOW unlock scroll — preloader is fully gone
                }, 1200); // Wait for the full door animation to complete
            }, 1000); // 1s display time before starting to dismiss
        }

        // Primary: dismiss on page fully loaded
        window.addEventListener('load', dismissPreloader);

        // Safety net: if the page is still loading after 5 seconds (slow hosting), force dismiss
        setTimeout(dismissPreloader, 5000);
    </script>
    </body>
</html>
