<style>
    /* Online Live Pulsing Dot */
    .online-indicator-dot {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #22c55e;
        border: 2px solid #061a11;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.75);
        animation: pulseOnline 2s infinite;
        z-index: 12;
    }
    @keyframes pulseOnline {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.75); }
        70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Fixed Widget Anchor */
    .bmi-floating-contact {
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 99999;
        font-family: inherit;
    }
    @media (max-width: 991px) {
        .bmi-floating-contact {
            bottom: 80px;
            left: 20px;
        }
    }

    /* FAB Wrapper & Invisible Hit Bridge */
    .bmi-fab-wrapper {
        position: relative;
        display: inline-block;
    }
    /* Invisible hover bridge connecting button to the popup menu */
    .bmi-fab-wrapper::before {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 240px;
        height: 190px;
        pointer-events: none;
        z-index: 1;
    }
    .bmi-fab-wrapper:hover::before,
    .bmi-fab-wrapper.is-open::before {
        pointer-events: auto;
    }

    /* Main Floating Trigger Button */
    .fab-main-trigger {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0b5d3f 0%, #062b1a 100%);
        border: 2px solid rgba(74, 222, 128, 0.5);
        color: #ffffff;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45), 0 0 25px rgba(74, 222, 128, 0.25);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        user-select: none;
        -webkit-user-select: none;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
    }
    .fab-main-trigger:hover {
        transform: scale(1.08);
        box-shadow: 0 16px 35px rgba(0, 0, 0, 0.55), 0 0 30px rgba(74, 222, 128, 0.4);
    }
    .fab-main-trigger .fab-icon-chat {
        transition: transform 0.3s ease, opacity 0.2s ease;
    }
    .fab-main-trigger .fab-icon-close {
        position: absolute;
        opacity: 0;
        transform: rotate(-90deg) scale(0.5);
        transition: transform 0.3s ease, opacity 0.2s ease;
    }
    .bmi-fab-wrapper.is-open .fab-main-trigger .fab-icon-chat {
        opacity: 0;
        transform: rotate(90deg) scale(0.5);
    }
    .bmi-fab-wrapper.is-open .fab-main-trigger .fab-icon-close {
        opacity: 1;
        transform: rotate(0deg) scale(1);
    }

    /* Expandable Options Menu */
    .fab-options-menu {
        position: absolute;
        bottom: 56px;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-bottom: 14px; /* Essential: bridges the hover gap directly to the trigger button */
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px) scale(0.96);
        transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s;
        pointer-events: none;
        z-index: 9;
    }
    .bmi-fab-wrapper.is-open .fab-options-menu,
    .bmi-fab-wrapper:hover .fab-options-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    /* Option Pills */
    .fab-option-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 9px 18px 9px 10px;
        border-radius: 9999px;
        background: rgba(8, 22, 15, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1.5px solid rgba(74, 222, 128, 0.35);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        color: #ffffff !important;
        text-decoration: none !important;
        white-space: nowrap;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .fab-option-pill:hover {
        transform: translateX(5px);
        background: rgba(12, 32, 22, 0.98);
        border-color: rgba(74, 222, 128, 0.75);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(74, 222, 128, 0.25);
    }
    .fab-option-icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .fab-option-whatsapp .fab-option-icon {
        background: linear-gradient(135deg, #25D366, #128C7E);
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
    }
    .fab-option-phone .fab-option-icon {
        background: linear-gradient(135deg, #0284c7, #0369a1);
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
</style>

<script>
    (function() {
        const trigger = document.getElementById("fabMainTriggerBtn");
        const wrapper = document.getElementById("fabConciergeWrapper");
        if (!trigger || !wrapper) return;

        // Toggle open/close on click (supports touch and desktop)
        function toggleConcierge(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            wrapper.classList.toggle("is-open");
        }

        trigger.addEventListener("click", toggleConcierge);

        // Enter or Space key support for accessibility
        trigger.addEventListener("keydown", function(e) {
            if (e.key === "Enter" || e.key === " ") {
                toggleConcierge(e);
            }
        });

        // Close when clicking anywhere outside
        document.addEventListener("click", function(e) {
            if (!wrapper.contains(e.target)) {
                wrapper.classList.remove("is-open");
            }
        });

        // Close on Escape key
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                wrapper.classList.remove("is-open");
            }
        });
    })();
</script>
